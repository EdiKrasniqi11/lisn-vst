name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # gh release create

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # GUI tests run locally (before each release) and in the DAWs; runners have no real display.
          .\pluginval\pluginval.exe --strictness-level 5 --skip-gui-tests --validate "build\StemSplitter_artefacts\Release\VST3\LISN StemSplitter.vst3"

      - name: Tag matches the CMake version
        if: env.RELEASE == 'true'
        run: |
          $v = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(StemSplitter VERSION ([0-9.]+)\)').Groups[1].Value
          if ("v$v" -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }} but CMakeLists.txt says $v" }

      - name: Installer
        if: env.RELEASE == 'true'
        run: |
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/download/0.12.21/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip
          if ((Get-FileHash uv.zip).Hash -ne '5d223efa0bf00208c3853246af09420419dfbd352536aa6bb8163d6170e23890') { throw 'uv checksum mismatch' }
          Expand-Archive uv.zip -DestinationPath uv
          Copy-Item uv\uv.exe installer\
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile installer\vc_redist.x64.exe
          # aka.ms always serves the newest redist, so there's no fixed hash: require Microsoft's valid signature instead.
          $sig = Get-AuthenticodeSignature installer\vc_redist.x64.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch '\bO=Microsoft Corporation\b') { throw "vc_redist signature: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$('${{ github.ref_name }}'.TrimStart('v'))" installer\lisn-vst.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$('${{ github.ref_name }}'.TrimStart('v'))" installer\lisn-desktop.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Draft release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $vst = 'installer\Output\LISN-StemSplitter-Setup.exe'
          $app = 'installer\Output\LISN-Setup.exe'
          $notes = "LISN-StemSplitter-Setup.exe is the VST3 for FL Studio and Ableton Live. SHA-256: $((Get-FileHash $vst).Hash.ToLower())`n`n" +
                   "LISN-Setup.exe is LISN, the desktop app. SHA-256: $((Get-FileHash $app).Hash.ToLower())"
          gh release create '${{ github.ref_name }}' $vst $app --draft --title 'LISN StemSplitter ${{ github.ref_name }}' --notes $notes

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --parallel --target lisn_tests progress_test StemSplitter_VST3 StemSplitter_Standalone -- -k 0

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Snapshots
        run: |
          mkdir snapshots
          "$(find build -name lisn_tests -type f -perm -u+x | head -n1)" --snapshots snapshots

      - name: pluginval
        run: |
          curl -fsSL https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip -o pluginval.zip
          unzip -q pluginval.zip -d pluginval
          # GUI tests run locally (before each release) and in the DAWs; runners have no real display.
          pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate "build/StemSplitter_artefacts/Release/VST3/LISN StemSplitter.vst3"

      - name: Zip the build
        run: |
          mkdir mac-build
          ditto -c -k --keepParent "build/StemSplitter_artefacts/Release/VST3/LISN StemSplitter.vst3" mac-build/vst3.zip
          ditto -c -k --keepParent "build/StemSplitter_artefacts/Release/Standalone/LISN StemSplitter.app" mac-build/app.zip

      - name: Screenshot the desktop app and try its window
        continue-on-error: true   # best effort: the runner may have no display; a failed check still shows red here
        run: |
          fail=0
          note() { echo "$*" | tee -a snapshots/mac-app-input.txt; }
          winpos() { osascript -e 'tell application "System Events" to get {position, size} of window 1 of (first process whose name is "LISN StemSplitter")' | tr -d ,; }
          "build/StemSplitter_artefacts/Release/Standalone/LISN StemSplitter.app/Contents/MacOS/LISN StemSplitter" &
          app=$!
          sleep 8
          osascript -e 'tell application "System Events" to set frontmost of (first process whose name is "LISN StemSplitter") to true' || true
          sleep 2
          screencapture -x snapshots/mac-app.png
          winpos > snapshots/mac-app-window.txt || true   # x, y, width, height as macOS reports them
          cat snapshots/mac-app-window.txt

          swiftc -O .github/mac-input.swift -o mac-input || { note "FAIL: could not build the input helper"; exit 1; }
          read -r wx wy ww wh <<< "$(winpos)"
          region="$wx,$wy,$ww,$wh"

          # 1. A click at the Midnight pill's top (window 513, 30), inside the 48 px strip: the theme must change.
          screencapture -x -R$region snapshots/mac-app-dusk.png
          before=$(./mac-input lum snapshots/mac-app-dusk.png)
          ./mac-input click $((wx + 513)) $((wy + 30))
          sleep 1
          screencapture -x -R$region snapshots/mac-app-midnight.png
          after=$(./mac-input lum snapshots/mac-app-midnight.png)
          if awk -v b="$before" -v a="$after" 'BEGIN { d = a - b; exit ! (d > 10 || d < -10) }'; then
            note "PASS click: a click at window (513, 30) switched the theme (mean luminance $before -> $after)"
          else
            note "FAIL click: a click at window (513, 30) did not switch the theme (mean luminance $before -> $after)"; fail=1
          fi

          # 2. A drag from empty header space inside the strip (window 350, 30) moves the window; 3. so does one below it (350, 54).
          check_drag() {   # name, start y in the window, expected dx, dy
            read -r x0 y0 _ _ <<< "$(winpos)"
            ./mac-input drag $((x0 + 350)) $((y0 + $2)) $3 $4
            sleep 1
            read -r x1 y1 _ _ <<< "$(winpos)"
            if [ $((x1 - x0 - $3)) -ge -6 ] && [ $((x1 - x0 - $3)) -le 6 ] && [ $((y1 - y0 - $4)) -ge -6 ] && [ $((y1 - y0 - $4)) -le 6 ]; then
              note "PASS $1: the window moved from ($x0, $y0) to ($x1, $y1) for a drag of ($3, $4)"
            else
              note "FAIL $1: the window went from ($x0, $y0) to ($x1, $y1) for a drag of ($3, $4)"; fail=1
            fi
          }
          check_drag "drag in the strip" 30 60 40
          check_drag "drag below the strip" 54 -60 -40

          kill $app || true
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: mac-snapshots
          path: snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: mac-build

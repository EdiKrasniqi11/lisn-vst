<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title bar A: the header is the title bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Unbounded:wght@700&amp;display=swap">
<style>
body{margin:0}
.lx{font-family:'DM Sans',sans-serif;color:#FFF4EA}
.lx button{font-family:inherit;color:inherit}
.desk{background:radial-gradient(120% 90% at 30% 15%,#2c2631 0%,#141217 72%)}
.win{position:relative;width:760px;height:500px;overflow:hidden;background:#D9775F}
.bg{position:absolute;left:0;top:0;width:100%;height:100%}
.hdr{position:absolute;left:24px;top:16px;width:712px;height:44px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Unbounded',sans-serif;font-weight:700;font-size:22px;letter-spacing:.08em}
.right{display:flex;align-items:center;gap:8px}
.pill{display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid rgba(255,244,234,.14);background:rgba(32,18,27,.72)}
.seg{height:30px;padding:0 14px;border:0;border-radius:999px;background:transparent;font-size:13px;font-weight:700;cursor:pointer}
.lx .seg.on{background:#FFF4EA;color:#2B1822}
.sep{width:1px;height:22px;background:rgba(255,244,234,.24);margin:0 2px}
.wbtn{width:32px;height:32px;padding:0;border-radius:999px;border:1px solid rgba(255,244,234,.18);background:rgba(32,18,27,.55);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.panel{position:absolute;left:24px;top:76px;width:712px;height:400px;box-sizing:border-box;border-radius:22px;border:1px solid rgba(255,244,234,.14);background:rgba(32,18,27,.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 26px 50px -22px rgba(20,8,16,.75);padding:12px;display:flex;flex-direction:column}
.info{position:absolute;right:14px;bottom:8px;width:14px;height:14px;box-sizing:border-box;border-radius:999px;border:1px solid rgba(255,244,234,.4);font-size:9px;line-height:12px;text-align:center;color:rgba(255,244,234,.55)}
.drop{flex-grow:1;border:2px dashed rgba(255,244,234,.3);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.upc{width:64px;height:64px;border-radius:999px;background:rgba(255,244,234,.12);display:flex;align-items:center;justify-content:center}
.dropt{font-family:'Unbounded',sans-serif;font-weight:700;font-size:24px}
.orrow{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,244,234,.7)}
.lx .primary{height:34px;padding:0 16px;border:0;border-radius:10px;background:#FFF4EA;color:#2B1822;font-size:13px;font-weight:700;cursor:pointer}
.fmt{font-size:12px;letter-spacing:.04em;color:rgba(255,244,234,.55)}
.get{margin-top:10px;font-size:12px;color:rgba(255,244,234,.6)}
.dots{display:flex;gap:8px}
.dp{display:flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:999px;background:rgba(255,244,234,.08);font-size:12px;font-weight:700}
.dp i{width:8px;height:8px;border-radius:999px}
</style>
</helmet>
<div class="lx desk" style="width: 840px; height: 620px; position: relative; overflow: hidden">
<div class="win" style="position: absolute; left: 40px; top: 60px; border-radius: 8px; box-shadow: 0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07)">
<svg class="bg" viewBox="0 0 760 500" preserveAspectRatio="none" aria-hidden="true">
<path fill="#6F7679" d="M560 0 C600 40 640 70 700 110 C735 135 750 220 760 300 L760 0 Z"></path>
<path fill="#F4A76F" d="M205 0 C250 30 300 40 320 70 C340 100 400 80 470 70 C520 62 540 30 560 0 Z"></path>
<path fill="#7B5467" d="M0 0 L215 0 C260 20 300 50 310 75 C280 80 200 90 120 110 C70 122 30 125 0 135 Z"></path>
<path fill="#D95F6B" d="M0 130 C40 120 70 118 95 116 C40 180 20 260 30 340 C35 400 60 450 90 500 L0 500 Z"></path>
<path fill="#7B5467" d="M250 500 C300 470 400 465 520 480 C560 485 600 495 620 500 Z"></path>
<path fill="#F08A7C" d="M760 330 C720 380 700 430 660 470 C640 488 600 495 560 500 L760 500 Z"></path>
<path fill="#F4A76F" d="M760 440 C740 470 720 490 700 500 L760 500 Z"></path>
<path fill="#F08A7C" d="M0 330 C40 360 80 430 140 500 L0 500 Z"></path>
</svg>
<div class="hdr">
<div class="logo">LISN</div>
<div class="right">
<div class="pill"><button class="seg on">Dusk</button><button class="seg">Midnight</button></div>
<div class="pill"><button class="seg on">4 stems</button><button class="seg">6 stems</button></div>
<div class="sep"></div>
<button class="wbtn" aria-label="Minimise"><svg class="ic" viewBox="0 0 24 24" style="width: 14px; height: 14px"><path d="M6 12h12"></path></svg></button>
<button class="wbtn" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" style="width: 14px; height: 14px"><path d="M7 7l10 10M17 7 7 17"></path></svg></button>
</div>
</div>
<div class="panel">
<div class="drop">
<div class="upc"><svg class="ic" viewBox="0 0 24 24" style="width: 22px; height: 22px"><path d="M12 15V4"></path><path d="m7 9 5-5 5 5"></path><path d="M5 15v4h14v-4"></path></svg></div>
<div class="dropt">Drop a song here</div>
<div class="orrow"><span>or</span><button class="primary">Browse…</button></div>
<div class="fmt">WAV · MP3 · FLAC · AIFF · OGG</div>
<div class="get">You'll get these stems</div>
<div class="dots"><span class="dp"><i style="background: #F4A76F"></i>Vocals</span><span class="dp"><i style="background: #EF7A7F"></i>Drums</span><span class="dp"><i style="background: #C9A0BD"></i>Bass</span><span class="dp"><i style="background: #A9B8BC"></i>Other</span></div>
</div>
</div>
<div class="info">i</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":840,"height":620}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

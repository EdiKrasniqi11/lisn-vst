<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Unbounded:wght@700&display=swap');
.lx { --cream:#FFF4EA; --ink:#2B1822; font-family:'DM Sans',sans-serif; color:var(--cream); }
.lx .win { position:relative; width:760px; height:500px; overflow:hidden; border-radius:10px; zoom:.82;
  background:
    radial-gradient(ellipse 60% 70% at 8% 20%, #7B5467 0 60%, transparent 61%),
    radial-gradient(ellipse 50% 60% at 60% 0%, #F4A76F 0 55%, transparent 56%),
    radial-gradient(ellipse 45% 55% at 95% 10%, #6F7679 0 70%, transparent 71%),
    radial-gradient(ellipse 60% 60% at 0% 100%, #D95F6B 0 55%, transparent 56%),
    radial-gradient(ellipse 70% 60% at 100% 100%, #F08A7C 0 50%, transparent 51%), #D9775F; }
.lx .hdr { position:absolute; left:24px; top:16px; width:712px; height:44px; display:flex; align-items:center; justify-content:space-between; }
.lx .logo { font-family:'Unbounded'; font-size:22px; letter-spacing:.08em; }
.lx .logo small { font-family:'DM Sans'; font-weight:500; font-size:14px; letter-spacing:0; margin-left:10px; }
.lx .pills { display:flex; gap:8px; }
.lx .pill { display:flex; gap:2px; padding:3px; border-radius:999px; border:1px solid rgba(255,244,234,.14); background:rgba(32,18,27,.72); }
.lx .pill span { height:30px; line-height:30px; padding:0 14px; border-radius:999px; font-size:13px; font-weight:700; }
.lx .pill .on { background:var(--cream); color:var(--ink); }
.lx .panel { position:absolute; left:24px; top:76px; width:712px; height:400px; box-sizing:border-box; border-radius:22px;
  border:1px solid rgba(255,244,234,.14); background:rgba(32,18,27,.66); backdrop-filter:blur(18px);
  padding:16px 18px; display:flex; flex-direction:column; gap:10px; box-shadow:0 26px 50px -22px rgba(20,8,16,.75); }
.lx .top { height:36px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
.lx .ibox { width:36px; height:36px; border-radius:10px; background:rgba(255,244,234,.1); display:flex; align-items:center; justify-content:center; font-size:15px; }
.lx .playbig { width:36px; height:36px; border-radius:999px; background:var(--cream); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.lx .tt { flex-grow:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.lx .tt b { font-size:15px; line-height:1.2; } .lx .tt i { font-style:normal; font-size:12px; line-height:1.2; color:rgba(255,244,234,.64); }
.lx .btn { height:34px; box-sizing:border-box; padding:0 12px; display:flex; align-items:center; gap:6px; border-radius:10px; border:1px solid rgba(255,244,234,.22);
  background:rgba(255,244,234,.06); font-size:13px; font-weight:700; white-space:nowrap; }
.lx .btn.on { background:rgba(244,167,111,.22); border-color:#F4A76F; }
.lx .chip { height:34px; box-sizing:border-box; padding:0 12px 0 8px; display:flex; align-items:center; gap:6px; border-radius:10px; border:1px dashed rgba(255,244,234,.3);
  color:rgba(255,244,234,.82); font-size:12px; font-weight:700; white-space:nowrap; }
.lx .div { height:1px; background:rgba(255,244,234,.12); flex-shrink:0; }
.lx .rows { flex-grow:1; display:flex; flex-direction:column; gap:10px; position:relative; }
.lx .row { display:flex; align-items:center; gap:14px; padding:0 10px; height:62px; border-radius:14px; flex-shrink:0; }
.lx .row.muted .nm, .lx .row.muted .wave { opacity:.38; }
.lx .nm { width:118px; display:flex; align-items:center; gap:10px; flex-shrink:0; }
.lx .badge { width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:14px; }
.lx .nm b { font-size:14px; display:block; } .lx .nm i { font-style:normal; font-size:11px; color:rgba(255,244,234,.6); }
.lx .led { width:38px; height:38px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; box-sizing:border-box; }
.lx .led.off { background:rgba(255,244,234,.06); border:1px solid rgba(255,244,234,.25); color:rgba(255,244,234,.5); }
.lx .wave { position:relative; flex-shrink:0; height:40px; }
.lx .foot { height:16px; display:flex; align-items:center; gap:8px; font-size:12px; color:rgba(255,244,234,.62); flex-shrink:0; }
.lx .tbar { height:40px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
.lx .tbar .time { font-size:13px; font-weight:700; } .lx .tbar .time i { font-style:normal; font-weight:400; color:rgba(255,244,234,.6); }
.lx .loopband { position:absolute; top:-4px; bottom:-4px; background:rgba(255,244,234,.10); border-left:2px solid var(--cream); border-right:2px solid var(--cream); border-radius:3px; pointer-events:none; }
.lx .head { position:absolute; top:-6px; bottom:-6px; width:2px; margin-left:-1px; background:var(--cream); border-radius:2px; pointer-events:none; }
.lx .note { font-size:13px; color:var(--text-secondary, #888); margin:6px 0 18px; }
</style>

<h2>Section 1: the Stems screen</h2>
<p class="subtitle">Layout A with the white speaker light. Bass is muted; a beat-snapped loop is on; the white line is the shared playhead. Right-click a light to solo.</p>
<div class="lx"><div class="win" data-layout="a" style="zoom:1"></div></div>
<script>
(function () {
  const stems = [
    { k:'Vocals', c:'#F4A76F', icon:'🎤', seed:11, kind:'v' },
    { k:'Drums',  c:'#EF7A7F', icon:'🥁', seed:23, kind:'d' },
    { k:'Bass',   c:'#C9A0BD', icon:'〰', seed:37, kind:'b', muted:true },
    { k:'Other',  c:'#A9B8BC', icon:'♫', seed:67, kind:'o' } ];
  const rnd = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
  const level = (kind, t, i, r) => kind === 'v' ? (((t>.05&&t<.3)||(t>.35&&t<.6)||(t>.66&&t<.95)) ? .3+.62*r : .04)
    : kind === 'd' ? ([.95,.5,.2,.2,.8,.5,.2,.2][i%8] * (.8+.2*r)) : kind === 'b' ? ((t>.47&&t<.52)?.04:.5+.15*r) : .26+.34*r+.28*t;
  const head = .38, loopA = .30, loopB = .45;
  function wave(s, w, h) {
    const n = 104, step = w / n, r = rnd(s.seed); let bars = '';
    for (let i = 0; i < n; i++) {
      const lv = Math.min(1, level(s.kind, i/(n-1), i, r())), half = Math.max(.75, lv*(h/2-.5));
      const col = (i/n) < head ? s.c : s.c + '4D';
      bars += `<rect x="${(i*step).toFixed(1)}" y="${(h/2-half).toFixed(1)}" width="${(step*.6).toFixed(1)}" height="${(2*half).toFixed(1)}" fill="${col}"/>`;
    }
    return `<svg width="${w}" height="${h}" style="display:block">${bars}</svg>`;
  }
  const header = `<div class="hdr"><div class="logo">LISN<small>StemSplitter</small></div><div class="pills">
     <div class="pill"><span class="on">Dusk</span><span>Midnight</span></div><div class="pill"><span class="on">4 stems</span><span>6 stems</span></div></div></div>`;
  function rows(rowH, waveH, waveW) {
    let html = '';
    for (const s of stems) {
      const led = `<div class="led off">${s.muted ? '<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:rgba(255,244,234,.5);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg>' : '<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:#FFF4EA;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>'}</div>`;
      html += `<div class="row ${s.muted?'muted':''}" style="height:${rowH}px">
        <div class="nm"><div class="badge" style="background:${s.c}29;color:${s.c}">${s.icon}</div><div><b>${s.k}</b><i>${s.k.toLowerCase()}.wav</i></div></div>
        ${led}<div class="wave" style="width:${waveW}px;height:${waveH}px">${wave(s, waveW, waveH)}</div>
        <div class="chip">⠿ Drag</div></div>`;
    }
    return html;
  }
  const overlay = (x0, w, top, bottom) =>
    `<div class="loopband" style="left:${x0 + w*loopA}px;width:${w*(loopB-loopA)}px;top:${top}px;bottom:${bottom}px"></div>
     <div class="head" style="left:${x0 + w*head}px;top:${top}px;bottom:${bottom}px"></div>`;
  const waveX = 10 + 118 + 14 + 38 + 14; // row padding + name + gap + led + gap
  const L = {
    a: () => `${header}<div class="panel">
      <div class="top"><div class="playbig">❚❚</div>
        <div class="tt"><b>Travis Snippet.mp3</b><i>1:04 / 3:12 · 92 BPM · loop 0:58–1:26</i></div>
        <div class="btn on">⟲ Loop</div><div class="chip">⠿ Drag loop</div><div class="btn">＋ New song</div></div>
      <div class="div"></div>
      <div class="rows">${rows(62, 40, 376)}${overlay(waveX, 376, 6, 6)}</div>
      <div class="foot">▸ Click a light to mute · right-click to solo · drag across waves to loop</div></div>`,
    b: () => `${header}<div class="panel">
      <div class="top"><div class="ibox">📄</div><div class="tt"><b>Travis Snippet.mp3</b><i>3:12 · split into 4 stems</i></div><div class="btn">＋ New song</div></div>
      <div class="tbar"><div class="playbig" style="width:40px;height:40px">❚❚</div><div class="time">1:04 <i>/ 3:12</i></div>
        <div style="flex-grow:1"></div><div class="btn on">⟲ Loop 0:58–1:26</div><div class="chip">⠿ Drag loop</div></div>
      <div class="div"></div>
      <div class="rows" style="gap:6px">${rows(54, 34, 376)}${overlay(waveX, 376, 6, 6)}</div></div>`,
    c: () => `${header}<div class="panel">
      <div class="top"><div class="ibox">📄</div><div class="tt"><b>Travis Snippet.mp3</b><i>3:12 · split into 4 stems</i></div><div class="btn">＋ New song</div></div>
      <div class="div"></div>
      <div class="rows" style="gap:6px">${rows(56, 36, 376)}${overlay(waveX, 376, 6, 6)}</div>
      <div class="div"></div>
      <div class="tbar"><div class="playbig">❚❚</div><div class="time">1:04 <i>/ 3:12</i></div><div style="flex-grow:1"></div>
        <div class="btn on">⟲ Loop 0:58–1:26</div><div class="chip">⠿ Drag loop</div></div></div>`
  };
  document.querySelectorAll('.lx .win').forEach(w => w.innerHTML = L[w.dataset.layout]());
})();
</script>

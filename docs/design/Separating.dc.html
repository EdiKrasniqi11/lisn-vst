<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Splitting a song</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
button:focus-visible{outline:2px solid #FFF4EA;outline-offset:2px}
</style>
</helmet>
<div style="width: 760px; height: 500px; position: relative; overflow: hidden; background: #6F7679; color: #FFF4EA; font-family: 'DM Sans', sans-serif">
  <div style="position: absolute; left: 0; top: 0; width: 760px; height: 500px">
    <dc-import name="Waves" hint-size="760px,500px"></dc-import>
  </div>
  <div style="position: absolute; left: 24px; top: 16px; width: 712px; height: 44px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: baseline; gap: 10px">
      <span style="font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.08em">LISN</span>
      <span style="font-size: 14px; font-weight: 500">StemSplitter</span>
    </div>
    <div style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(32, 18, 27, 0.62); border: 1px solid rgba(255, 244, 234, 0.14); backdrop-filter: blur(12px); opacity: 0.55">
      <button type="button" disabled="{{yes}}" aria-pressed="true" style="height: 30px; padding: 0 14px; border: none; border-radius: 999px; font-size: 13px; font-weight: 700; background: #FFF4EA; color: #2B1822">4 stems</button>
      <button type="button" disabled="{{yes}}" aria-pressed="false" style="height: 30px; padding: 0 14px; border: none; border-radius: 999px; font-size: 13px; font-weight: 700; background: rgba(255, 244, 234, 0); color: #FFF4EA">6 stems</button>
    </div>
  </div>
  <div style="position: absolute; left: 24px; top: 76px; width: 712px; height: 400px; box-sizing: border-box; border-radius: 22px; background: rgba(32, 18, 27, 0.66); border: 1px solid rgba(255, 244, 234, 0.14); box-shadow: 0 26px 50px -22px rgba(20, 8, 16, 0.75); backdrop-filter: blur(18px) saturate(1.15); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="font-size: 15px; font-weight: 700">Travis Snippet.mp3</span>
      <span style="font-size: 13px; color: rgba(255, 244, 234, 0.68)">Splitting into vocals · drums · bass · other</span>
    </div>
    <span style="font-family: 'Unbounded', sans-serif; font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums">58%</span>
    <div style="position: relative; width: 440px; height: 40px">
      <svg viewBox="0 0 440 40" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 440px; height: 40px; fill: none; stroke: rgba(255, 244, 234, 0.2); stroke-width: 4; stroke-linecap: round"><path d="{{track}}"></path></svg>
      <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 58%; overflow: hidden">
        <svg viewBox="0 0 440 40" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 440px; height: 40px; fill: none; stroke: #F4A76F; stroke-width: 4; stroke-linecap: round"><path d="{{track}}"></path></svg>
      </span>
      <span style="position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 999px; background: #FFF4EA; box-shadow: 0 0 0 4px rgba(244, 167, 111, 0.35); left: {{knobX}}px; top: {{knobY}}px"></span>
    </div>
    <button type="button" style="height: 36px; padding: 0 18px; border-radius: 10px; border: 1px solid rgba(255, 244, 234, 0.3); background: rgba(255, 244, 234, 0.06); color: #FFF4EA; font-size: 13px; font-weight: 700; cursor: pointer">Cancel</button>
    <span style="max-width: 420px; text-align: center; font-size: 12px; line-height: 1.5; color: rgba(255, 244, 234, 0.6)">The first split downloads the AI model (about 80 MB), so it can sit at 0% for a minute. After that it starts right away.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":500}}'>
class Component extends DCLogic {
  renderVals() {
    const w = 440, mid = 20, amp = 8, wl = 55;
    let d = '';
    for (let x = 4; x <= w - 4; x += 2) {
      d += (x === 4 ? 'M' : ' L') + x + ' ' + (mid + amp * Math.sin((x / wl) * Math.PI * 2)).toFixed(2);
    }
    const kx = w * 0.58;
    return { yes: true, track: d, knobX: kx.toFixed(1), knobY: (mid + amp * Math.sin((kx / wl) * Math.PI * 2)).toFixed(1) };
  }
}
</script>
</body>
</html>
